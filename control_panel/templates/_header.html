  <header class="topbar">
    <h1>Banking Control Panel</h1>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' else '' }}">Dashboard</a>
      <a href="{{ url_for('accounts_page') }}" class="{{ 'active' if active == 'accounts' else '' }}">Accounts</a>
      <a href="{{ url_for('logs_page') }}" class="{{ 'active' if active == 'logs' else '' }}">Live Logs</a>
      <a href="{{ url_for('live_page') }}" class="{{ 'active' if active == 'live' else '' }}">Live</a>
      <a href="{{ url_for('proxies_page') }}" class="{{ 'active' if active == 'proxies' else '' }}">Proxies</a>
      {% if user and user.role == 'admin' %}
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
      <a href="{{ url_for('users_page') }}" class="{{ 'active' if active == 'users' else '' }}">Users</a>
      {% endif %}
    </nav>
    <span class="user">signed in as <b>{{ user.username if user else '' }}</b>{% if user and user.role %} <span class="role role-{{ user.role }}">{{ user.role }}</span>{% endif %}</span>
    <a class="logout" href="{{ url_for('logout') }}">Log out</a>
  </header>
  <script>window.PANEL_ROLE = {{ (user.role if user else '')|tojson }}; window.PANEL_USER_ID = {{ (user.id if user else '')|tojson }};</script>
