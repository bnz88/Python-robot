{# Inline SVG icon set (24px grid, currentColor). No CDN, works offline. #}
{% macro icon(name, cls='') -%}
<svg class="i {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'brand' -%}
<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3" r="1"/><path d="M9 13h.01M15 13h.01"/><path d="M9 17h6"/>
{%- elif name == 'dashboard' -%}
<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'accounts' -%}
<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/>
{%- elif name == 'logs' -%}
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/>
{%- elif name == 'live' -%}
<rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/><path d="M7 10.5h2l1.5-3 2.5 6 1.5-3h2.5"/>
{%- elif name == 'proxies' -%}
<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>
{%- elif name == 'settings' -%}
<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>
{%- elif name == 'users' -%}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3 2.9-5.5 6.5-5.5s6.5 2.5 6.5 5.5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6"/><path d="M18.5 14.8c1.8.8 3 2.3 3 4.2"/>
{%- elif name == 'chevron-left' -%}
<path d="M15 6l-6 6 6 6"/>
{%- elif name == 'menu' -%}
<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'logout' -%}
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'refresh' -%}
<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
{%- elif name == 'play' -%}
<path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/>
{%- elif name == 'stop' -%}
<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'check' -%}
<path d="m5 12 5 5L20 7"/>
{%- elif name == 'alert' -%}
<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
{%- elif name == 'search' -%}
<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'zap' -%}
<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>
{%- elif name == 'activity' -%}
<path d="M3 12h4l3 8 4-16 3 8h4"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
{%- elif name == 'copy' -%}
<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>
{%- elif name == 'eye' -%}
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'edit' -%}
<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'trash' -%}
<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>
{%- elif name == 'ban' -%}
<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>
{%- elif name == 'server' -%}
<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
{%- elif name == 'power' -%}
<path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>
{%- elif name == 'external' -%}
<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
{%- elif name == 'maximize' -%}
<path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/>
{%- elif name == 'database' -%}
<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{%- endif -%}
</svg>
{%- endmacro %}
