<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking Control Panel - Live View</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set active = 'live' %}
  {% include '_header.html' %}

  <main>
    <div class="log-toolbar">
      <span class="muted">Live desktop view per robot — auto-refreshes every {{ refresh_ms }} ms</span>
    </div>
    <div id="live-grid" data-refresh-ms="{{ refresh_ms }}"></div>

    <dialog id="live-modal" class="live-modal">
      <div class="live-modal-head">
        <span id="live-modal-title" class="live-modal-title"></span>
        <span class="log-card-actions">
          <button type="button" class="primary" data-act="start" title="Start scraping">Start</button>
          <button type="button" data-act="stop" title="Stop scraping">Stop</button>
        </span>
        <span class="log-card-status"></span>
        <button type="button" id="live-modal-close" class="live-modal-close"
                aria-label="Close enlarged view" title="Close">&times;</button>
      </div>
      <img id="live-modal-img" alt="enlarged live view">
    </dialog>
  </main>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='live.js') }}"></script>
</body>
</html>
