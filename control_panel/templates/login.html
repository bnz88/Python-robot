<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - BCA Ops</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <h1>BCA Ops</h1>
    <p class="login-sub">Sign in to the robot control panel</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <div class="field"><span class="fl">Username</span>
      <input type="text" name="username" autocomplete="username" placeholder="username" required autofocus>
    </div>
    <div class="field"><span class="fl">Password</span>
      <input type="password" name="password" autocomplete="current-password" placeholder="password" required>
    </div>
    <div class="field"><span class="fl">&nbsp;</span><button type="submit" class="primary">Sign in</button></div>
  </form>
</body>
</html>
