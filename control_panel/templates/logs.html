<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking Control Panel - Live Logs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set active = 'logs' %}
  {% include '_header.html' %}

  <main>
    <div class="log-toolbar">
      <span class="muted">Auto-refreshes every 2s</span>
      <label>lines <input id="log-lines" type="number" value="150" min="1"></label>
    </div>
    <div id="log-grid"></div>
  </main>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='logs.js') }}"></script>
</body>
</html>
