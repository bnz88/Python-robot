<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Logs - BCA Ops</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set active = 'logs' %}
{% set page_title = 'Live Logs' %}
{% set page_sub = 'Every robot console, refreshed automatically. Start, stop and inspect from one screen.' %}
<div class="app" id="app">
  {% include '_sidebar.html' %}
  <div class="main">
    {% include '_header.html' %}

    <main>
      <div class="section-head">
        <div>
          <h2>Robot logs</h2>
          <p>Auto-refreshes every 2 seconds.</p>
        </div>
        <div class="log-toolbar">
          <label>lines <input id="log-lines" type="number" value="150" min="1"></label>
        </div>
      </div>
      <div id="log-grid"></div>
    </main>
  </div>
</div>

<script src="{{ url_for('static', filename='common.js') }}"></script>
<script src="{{ url_for('static', filename='shell.js') }}"></script>
<script src="{{ url_for('static', filename='logs.js') }}"></script>
</body>
</html>
