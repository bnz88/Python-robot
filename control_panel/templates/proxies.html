<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking Control Panel - Proxies</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set active = 'proxies' %}
  {% include '_header.html' %}

  <main>
    <p id="status" class="status"></p>

    <section class="panel">
      <h2>Add proxy</h2>
      <form id="add-proxy-form" class="add-account">
        <div class="field"><span class="fl">IP / Host</span>
          <input name="ip" placeholder="proxy ip / host" required>
        </div>
        <div class="field"><span class="fl">Port</span>
          <input name="port" type="number" placeholder="proxy port" required>
        </div>
        <div class="field"><span class="fl">Note</span>
          <input name="note" placeholder="note (optional)">
        </div>
        <div class="field"><span class="fl"></span><button type="submit" class="primary">Add</button></div>
      </form>
      <p class="hint">Proxies here can be selected when adding or editing a robot.</p>
    </section>

    <section class="panel">
      <h2>Proxy list</h2>
      <table id="proxies-table">
        <thead>
          <tr><th>IP</th><th>Port</th><th>Note</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='proxies.js') }}"></script>
</body>
</html>
